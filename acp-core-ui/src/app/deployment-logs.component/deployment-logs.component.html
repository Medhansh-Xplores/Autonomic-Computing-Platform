<div class="logs-container">

  <h2>{{ status }}</h2>

  <div class="logs-box" #scrollContainer>
    <div *ngFor="let log of logs">
      <pre>{{ log }}</pre>
    </div>
  </div>

  <div *ngIf="isComplete" class="actions">
    <button (click)="goBack()">View Cloud Infrastructure</button>
  </div>

</div>
