<div class="usa-overlay"></div>

<header>

  <!-- TOP HEADER -->
  <div class="header-container">
    
    <!-- LOGO -->
    <div class="logo-container">
      <a class="logo" [routerLink]="['/']" title="Navigate to Home Page">
        <img src="../../assets/img/autonomic_solutions_logo.JPG"
             id="as-logo-img"
             alt="Cloud Accelerator Logo">
      </a>
    </div>

    <!-- TOP MENU -->
    <div class="navbar">
      <div class="menu">
        <ul>
          <li><a routerLink="">ABOUT</a></li>
          <li><a routerLink="">CONTACT US</a></li>
          <li><a routerLink="services">SERVICES</a></li>
        </ul>
      </div>
    </div>

  </div>

  <!-- USER NAVBAR -->
  <div *ngIf="this.curUser" class="usa-nav">

    <ul class="usa-nav__primary">

      <!-- LEFT -->
      <li class="usa-nav__primary-item">
        <a class="usa-nav__link" routerLink="services">
          <fa-icon [icon]="faHome"></fa-icon> Home
        </a>
      </li>

      <li class="usa-nav__primary-item">
        <a class="usa-nav__link" routerLink="/cloud-setup">
          <fa-icon [icon]="faCloud"></fa-icon> Cloud Accounts
        </a>
      </li>

      <!-- RIGHT (auto pushed) -->
      <li class="usa-nav__primary-item right-item">
        <a class="usa-nav__link">
          <fa-icon [icon]="faUserCircle"></fa-icon> {{curUser.userName}}
        </a>
      </li>

      <li class="usa-nav__primary-item">
        <a class="usa-nav__logout__link" (click)="logOutUser()">
          <fa-icon [icon]="faSignOutAlt"></fa-icon> Logout
        </a>
      </li>

    </ul>

  </div>

</header>
