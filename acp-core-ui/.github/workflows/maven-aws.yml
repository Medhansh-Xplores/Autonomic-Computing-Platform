# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# A container image will be created and pushed to either AWS ECR.  The Container tag will be stored in AWS SSM Parameter.

name: Build and Deploy to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1                        # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: acp-core-ui                  # set this to your Amazon ECR repository name
  SSM_TAG_PARAMETER: /tags/acp-core-ui         # set this to target AWS SSM parameter name

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # --------------------------------------------------------------------------------

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and tag container image
      id: build-ecr-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and tag
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    - name: ECR Push image 
      if: ${{ github.event_name != 'pull_request' }}
      id: push-image
      run: docker push ${{ steps.build-ecr-image.outputs.image }}

    - name: Store image tag in SSM Parameter 
      if: ${{ github.event_name != 'pull_request' }}
      id: store-tag
      uses: joshghent/aws-ssm-parameter-store@v2.2.0
      with:
        ssm-path: ${{ env.SSM_TAG_PARAMETER }}
        ssm-value: ${{ steps.build-ecr-image.outputs.image }}
        aws-region: ${{ env.AWS_REGION }}
        ssm-value-type: "String"
        ssm-value-description: "Store ECR Image Tag"
        ssm-value-overwrite: true

